services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    hostname: npm
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - "/opt/homelab/data/nginx-proxy-manager:/data"
      - "/opt/homelab/data/nginx-proxy-manager/letsencrypt:/etc/letsencrypt"
    restart: unless-stopped
