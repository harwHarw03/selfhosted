services:
  couchdb:
    image: couchdb:3.4
    container_name: obsidian-livesync
    hostname: obsidian-livesync
    user: "5984:5984"
    environment:
      COUCHDB_USER: "${COUCHDB_USER:?COUCHDB_USER is required}"
      COUCHDB_PASSWORD: "${COUCHDB_PASSWORD:?COUCHDB_PASSWORD is required}"
      TZ: "${TZ}"
    volumes:
      - "/opt/homelab/data/obsidian-livesync/data:/opt/couchdb/data"
      - "/opt/homelab/data/obsidian-livesync/etc:/opt/couchdb/etc/local.d"
    ports:
      - "10.10.20.101:5984:5984"
      - "127.0.0.1:5984:5984"
    restart: unless-stopped
