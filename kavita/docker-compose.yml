services:
  kavita:
    image: jvmilazz0/kavita:0.9.0.2
    container_name: kavita
    hostname: kavita
    environment:
      TZ: "${TZ}"
    volumes:
      - "/opt/homelab/data/kavita:/kavita/config"
      - type: bind
        source: /mnt/storage/media
        target: /media
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "5000:5000"
    restart: unless-stopped
