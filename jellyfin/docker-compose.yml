services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    hostname: jellyfin
    environment:
      TZ: "${TZ}"
    volumes:
      - "/opt/homelab/data/jellyfin/config:/config"
      - type: bind
        source: /mnt/storage/media
        target: /media
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "8096:8096"
    restart: unless-stopped
