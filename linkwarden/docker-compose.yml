services:
  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:latest
    container_name: linkwarden
    hostname: linkwarden
    ports:
      - "8091:3000"
    environment:
      NEXTAUTH_URL: "http://localhost:8091"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      DATABASE_URL: "postgresql://linkwarden:${DB_PASSWORD}@linkwarden-db:5432/linkwarden"
    env_file: ./.env
    depends_on:
      linkwarden-db:
        condition: service_healthy
    volumes:
      - "/opt/homelab/data/linkwarden:/data/data"
    restart: unless-stopped

  linkwarden-db:
    image: postgres:16-alpine
    container_name: linkwarden-db
    hostname: linkwarden-db
    env_file: ./.env
    environment:
      POSTGRES_USER: linkwarden
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: linkwarden
    volumes:
      - "/opt/homelab/data/linkwarden/postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkwarden"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
