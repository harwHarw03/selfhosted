services:
  affine:
    image: ghcr.io/toeverything/affine:${AFFINE_REVISION:-stable}
    container_name: affine
    hostname: affine
    ports:
      - "3010:3010"
    depends_on:
      redis:
        condition: service_healthy
      affine-db:
        condition: service_healthy
      affine-migration:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      REDIS_SERVER_HOST: redis
      DATABASE_URL: "postgresql://${DB_USERNAME}:${DB_PASSWORD}@affine-db:5432/${DB_DATABASE}"
      AFFINE_INDEXER_ENABLED: "false"
    volumes:
      - "/opt/homelab/data/affine/storage:/root/.affine/storage"
      - "/opt/homelab/data/affine/config:/root/.affine/config"
    restart: unless-stopped

  affine-migration:
    image: ghcr.io/toeverything/affine:${AFFINE_REVISION:-stable}
    container_name: affine-migration
    hostname: affine-migration
    command: ["sh", "-c", "node ./scripts/self-host-predeploy.js"]
    env_file:
      - .env
    environment:
      REDIS_SERVER_HOST: redis
      DATABASE_URL: "postgresql://${DB_USERNAME}:${DB_PASSWORD}@affine-db:5432/${DB_DATABASE}"
      AFFINE_INDEXER_ENABLED: "false"
    depends_on:
      affine-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - "/opt/homelab/data/affine/storage:/root/.affine/storage"
      - "/opt/homelab/data/affine/config:/root/.affine/config"

  redis:
    image: redis:7-alpine
    container_name: affine-redis
    hostname: redis
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  affine-db:
    image: pgvector/pgvector:pg16
    container_name: affine-db
    hostname: affine-db
    environment:
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_DATABASE}"
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - "/opt/homelab/data/affine/postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USERNAME}", "-d", "${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
