name: filebrowser

services:
  filebrowser:
    image: gtstef/filebrowser:stable@sha256:fc213590ebc090cb8205125cd3ecdfa9066b9ed4a0b53fe2570972d6a3379e73
    container_name: filebrowser
    hostname: filebrowser
    user: "0:0"
    environment:
      TZ: "${TZ}"
      FILEBROWSER_ADMIN_PASSWORD: "${FILEBROWSER_ADMIN_PASSWORD:?FILEBROWSER_ADMIN_PASSWORD is required}"
      FILEBROWSER_TOTP_SECRET: "${FILEBROWSER_TOTP_SECRET:?FILEBROWSER_TOTP_SECRET is required}"
    volumes:
      - "/opt/homelab/data/filebrowser:/home/filebrowser/data"
      - "./config.yaml:/home/filebrowser/data/config.yaml:ro"
      - type: bind
        source: /mnt/storage
        target: /srv
        bind:
          create_host_path: false
    ports:
      - "10.10.20.102:8084:8084"
      - "127.0.0.1:8084:8084"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
