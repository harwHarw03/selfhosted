name: homepage

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.2@sha256:a0b71c8e757298d02560186bab9fbe3fc2d375c523a62cc1019177b37e48aa28
    container_name: homepage
    hostname: homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "${HOMEPAGE_ALLOWED_HOSTS:?HOMEPAGE_ALLOWED_HOSTS is required}"
      HOMEPAGE_VAR_FILEBROWSER_URL: "${HOMEPAGE_VAR_FILEBROWSER_URL:?HOMEPAGE_VAR_FILEBROWSER_URL is required}"
      HOMEPAGE_VAR_PHOTOPRISM_URL: "${HOMEPAGE_VAR_PHOTOPRISM_URL:?HOMEPAGE_VAR_PHOTOPRISM_URL is required}"
      LOG_TARGETS: stdout
      PUID: "1000"
      PGID: "1000"
    volumes:
      - "./config/settings.yaml:/app/config/settings.yaml:ro"
      - "./config/services.yaml:/app/config/services.yaml:ro"
      - "./config/widgets.yaml:/app/config/widgets.yaml:ro"
      - "./config/bookmarks.yaml:/app/config/bookmarks.yaml:ro"
    ports:
      - "3000:3000"
    restart: unless-stopped
